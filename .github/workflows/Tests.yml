name: "Run Tests"
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

jobs:
  tests:
    # Restore grouped-tests.yml and test/test_groups.toml's full matrix after
    # OrdinaryDiffEq.jl#4614 is released and the temporary Core source is removed.
    strategy:
      fail-fast: false
      matrix:
        group: ["QA", "InterfaceI", "InterfaceII"]
    name: "${{ matrix.group }} (latest Julia)"
    uses: "SciML/.github/.github/workflows/tests.yml@v1"
    with:
      project: "."
      group: "${{ matrix.group }}"
      julia-version: "1"
      num-threads: "1"
      coverage-directories: "src,ext"
      timeout-minutes: 120
    secrets: "inherit"
